[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-referee"
version = "0.1.1"
description = "Should you switch models? Replay your own eval set on a candidate and get a verdict that holds up."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "evals", "model-selection", "agents", "promptfoo", "langfuse", "braintrust"]
# Zero runtime dependencies on purpose: it runs anywhere Python does.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
margin-referee = "margin_referee.cli:main"

[tool.setuptools]
packages = ["margin_referee"]
