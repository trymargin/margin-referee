[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-referee"
version = "0.1.3"
description = "Can you ship this AI change? A verdict on a model, prompt, tool or host change from your own eval cases, with a receipt anyone can verify."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "evals", "model-selection", "agents", "promptfoo", "langfuse", "braintrust"]
# Zero runtime dependencies on purpose: it runs anywhere Python does.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only `margin-referee verify` needs it; everything else stays dependency-free.
verify = ["cryptography>=42"]

[project.scripts]
margin-referee = "margin_referee.cli:main"

[tool.setuptools]
packages = ["margin_referee"]
